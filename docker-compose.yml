services:
  postgres:
    image: postgres:16
    container_name: flowmeet-postgres
    environment:
      POSTGRES_DB: flowmeet
      POSTGRES_USER: flowmeet
      POSTGRES_PASSWORD: local-password
    ports:
      - "5432:5432"
    volumes:
      - flowmeet-pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmeet -d flowmeet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowmeet-pgdata:
