spring:
  application:
    name: flowmeet-backend
  profiles:
    # default 를 두지 않는다 — JAR 배포에서 SPRING_PROFILES_ACTIVE 미지정 시 placeholder 미해결로 즉시 기동 실패.
    # 로컬 개발은 build.gradle.kts 의 bootRun/test task 가 'local' 을 주입한다.
    active: ${SPRING_PROFILES_ACTIVE}
  datasource:
    url: jdbc:postgresql://localhost:5432/flowmeet
    username: flowmeet
    password: local-password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 8080

flowmeet:
  uploads-dir: ./uploads
  jwt:
    # secret 은 profile(application-{local,prod}.yml)에서 주입. 운영은 JWT_SECRET env var 필수(기동 실패로 보호).
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
      allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed-headers: [Authorization, Content-Type, X-Request-Id]
      allow-credentials: true
    # refresh-token.pepper / cookie-secure 는 profile 에서 주입.
  deepgram:
    api-key: ${DEEPGRAM_API_KEY:}
  claude:
    api-key: ${CLAUDE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
