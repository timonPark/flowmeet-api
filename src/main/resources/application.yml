spring:
  application:
    name: flowmeet-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/flowmeet
    username: flowmeet
    password: local-password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 8080

flowmeet:
  uploads-dir: ./uploads
  jwt:
    # 운영 전환 시 JWT_SECRET 환경변수로 반드시 교체 (HS256 최소 32bytes, 권장 ≥ 64bytes 랜덤).
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-local-dev-secret-at-least-32-bytes}
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
      allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      allowed-headers: [Authorization, Content-Type, X-Request-Id]
      allow-credentials: true
  deepgram:
    api-key: ${DEEPGRAM_API_KEY:}
  claude:
    api-key: ${CLAUDE_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
